<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <!-- Favicon = značka webu: obrys domu, jehož základnu tvoří zvuková vlna.
       Odvozeno z loga klienta (dům + vlna + ucho, claim „Slyším váš domov").
       Barvy jsou natvrdo, ne přes CSS proměnné — favicon se načítá samostatně,
       mimo stránku, takže by se proměnné neměly kde vzít. -->
  <rect width="44" height="44" rx="10" fill="#08343a"/>
  <path d="M10 21.5 22 11.5l12 10" stroke="#73c7d2" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M12.5 23.2v9.3h19v-9.3" stroke="#73c7d2" stroke-width="2.2" opacity="0.55"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M12.5 28.6h2.6l1.5-4.4 2.1 8.3 2.2-11 2.1 11 1.7-6.1 1.3 2.2h5.5"
        stroke="#ffffff" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
